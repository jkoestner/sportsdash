# sportsdash configuration
# Add or remove leagues/teams here; no code changes needed for any league ESPN
# publishes a scoreboard for (find sport/league slugs in ESPN site URLs, e.g.
# https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard).

timezone: America/New_York
refresh_seconds: 60        # auto-refresh for the Scores page
schedule_days: 7           # default schedule window

leagues:
  - key: nfl
    name: NFL
    sport: football
    league: nfl
    standings_columns: [W, L, T, PCT, PF, PA, DIFF, DIV, STRK]
    # Bracket format: each round and how many matchups it has. Rounds ESPN hasn't scheduled
    # yet show as TBD, so the bracket always runs out to the final.
    playoffs_rounds: {Wild Card: 6, Divisional: 4, Conference Championships: 2, Super Bowl: 1}

  - key: ncaaf
    name: NCAAF
    sport: football
    league: college-football
    params: {groups: 80}          # 80 = all FBS games (default is Top 25 only)
    rankings: ap                  # AP Top 25: rank badges, Top 25 filter, poll on Standings
    playoffs_match: College Football Playoff   # bracket = CFP games; other bowls are listed below it
    playoffs_rounds: {First Round: 4, Quarterfinal: 4, Semifinal: 2, National Championship: 1}
    standings_columns: [CONF, Total, PF, PA, STRK]

  - key: ncaab
    name: NCAAB
    sport: basketball
    league: mens-college-basketball
    params: {groups: 50}          # 50 = all Division I
    playoffs_match: NCAA Men's Basketball Championship   # the tournament; NIT etc. listed below it
    playoffs_rounds: {First Four: 4, 1st Round: 32, 2nd Round: 16, Sweet 16: 8, Elite 8: 4, Final Four: 2, National Championship: 1}
    standings_columns: [CONF, Total, PCT, STRK]

  - key: epl
    name: EPL
    sport: soccer
    league: eng.1
    standings_columns: [GP, W, D, L, F, A, GD, P]
    playoffs: false               # no postseason

  - key: nhl
    name: NHL
    sport: hockey
    league: nhl
    standings_columns: [GP, W, L, OTL, PTS, GF, GA, DIFF, STRK]
    playoffs_rounds: {1st Round: 8, 2nd Round: 4, Conference Finals: 2, Stanley Cup Final: 1}

  - key: mlb
    name: MLB
    sport: baseball
    league: mlb
    standings_columns: [W, L, PCT, GB, Home, AWAY, STRK]
    standings_params: {sort: "winpercent:desc"}   # ESPN's default MLB division order is scrambled
    playoffs_rounds: {Wild Card: 4, Division Series: 4, Championship Series: 2, World Series: 1}

  - key: pga
    name: PGA Tour
    sport: golf
    league: pga
    kind: golf

teams:
  - name: Virginia Cavaliers
    short: UVA
    espn_id: "258"
    leagues: [ncaaf, ncaab]
    color: "#E57200"

  - name: Dallas Cowboys
    short: DAL
    espn_id: "6"
    leagues: [nfl]
    color: "#3D7DD8"
